[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyromhacking"
dynamic = ["version"]
description = "HTML scraper for romhacking.net (RHDN: ROM hacks, translations, utilities, documents) — no official API, best-effort selectors"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "unblock_requests",
]

[project.optional-dependencies]
anon = ["anon_requests"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/LeMetadatarr/pyromhacking"

[project.scripts]
pyromhacking-dataset = "pyromhacking.dataset:main"

[tool.setuptools.dynamic]
version = { attr = "pyromhacking.version.__version__" }

[tool.setuptools.packages.find]
include = ["pyromhacking*"]

[tool.pytest.ini_options]
markers = [
    "live: hits romhacking.net over the network (needs FlareSolverr); deselect with -m 'not live'",
]
